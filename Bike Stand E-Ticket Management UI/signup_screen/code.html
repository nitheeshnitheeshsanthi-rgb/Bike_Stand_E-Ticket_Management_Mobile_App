<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-bright": "#2c2c2c",
              "on-tertiary-fixed-variant": "#005160",
              "on-secondary-fixed-variant": "#5c5b5b",
              "primary": "#a2ffbf",
              "tertiary-fixed": "#11d8ff",
              "surface-dim": "#0e0e0e",
              "on-secondary-fixed": "#3f3f3f",
              "surface-tint": "#a2ffbf",
              "surface-container-low": "#131313",
              "error-dim": "#d7383b",
              "surface-container": "#1a1a1a",
              "primary-fixed": "#00fd93",
              "surface-container-lowest": "#000000",
              "secondary-dim": "#d6d4d3",
              "surface-variant": "#262626",
              "tertiary-container": "#11d8ff",
              "inverse-on-surface": "#565555",
              "outline": "#767575",
              "primary-fixed-dim": "#00ed89",
              "tertiary-dim": "#00caee",
              "surface": "#0e0e0e",
              "primary-container": "#00fd93",
              "on-secondary": "#525151",
              "on-primary-fixed-variant": "#006638",
              "secondary": "#e4e2e1",
              "tertiary-fixed-dim": "#00caee",
              "secondary-fixed-dim": "#d6d4d3",
              "on-background": "#ffffff",
              "primary-dim": "#00ed89",
              "surface-container-highest": "#262626",
              "on-tertiary": "#005160",
              "on-secondary-container": "#d2d0cf",
              "inverse-surface": "#fcf9f8",
              "on-tertiary-fixed": "#00313c",
              "outline-variant": "#484847",
              "on-primary-fixed": "#004624",
              "on-surface-variant": "#adaaaa",
              "on-surface": "#ffffff",
              "surface-container-high": "#20201f",
              "background": "#0e0e0e",
              "on-error-container": "#ffa8a3",
              "inverse-primary": "#006e3c",
              "on-primary-container": "#005b31",
              "error": "#ff716c",
              "on-primary": "#006437",
              "tertiary": "#7be2ff",
              "secondary-container": "#474747",
              "error-container": "#9f0519",
              "on-error": "#490006",
              "on-tertiary-container": "#004755",
              "secondary-fixed": "#e4e2e1"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus { outline: none; ring: 0; }
        .tab-active { background-color: #a2ffbf; color: #004624; }
        .tab-inactive { color: #adaaaa; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen selection:bg-primary/30">
<!-- Top Navigation Anchor (Suppressing Side/Bottom Nav as per Transactional Rule) -->
<header class="fixed top-0 w-full z-50 bg-[#1a1a1a] flex items-center justify-between px-6 h-16">
<div class="flex items-center gap-2">
<span class="text-primary font-headline font-black tracking-widest text-lg uppercase">VELO_KINETIC</span>
</div>
<button class="text-on-surface-variant hover:opacity-80 active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</header>
<main class="pt-24 pb-12 px-6 max-w-md mx-auto">
<!-- Hero Section -->
<section class="mb-10">
<h1 class="font-headline font-extrabold text-display-lg text-4xl tracking-tighter mb-2">Create Account</h1>
<p class="text-on-surface-variant font-body">Join the urban kinetic movement. Choose your role to get started.</p>
</section>
<!-- Role Toggle -->
<div class="bg-surface-container rounded-full p-1.5 flex items-center mb-8 shadow-inner">
<button class="flex-1 py-3 px-6 rounded-full font-headline font-bold text-sm tracking-wide transition-all duration-300 tab-active" id="tab-user">
                User
            </button>
<button class="flex-1 py-3 px-6 rounded-full font-headline font-bold text-sm tracking-wide transition-all duration-300 tab-inactive" id="tab-staff">
                Staff
            </button>
</div>
<!-- Signup Forms Container -->
<div class="space-y-6">
<!-- User Fields (Visible by default) -->
<div class="space-y-5" id="user-fields">
<div class="relative group">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1">Name</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl px-4 py-4 ring-1 ring-white/5 group-focus-within:ring-primary/40 transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="person">person</span>
<input class="bg-transparent border-none p-0 w-full text-on-surface placeholder:text-outline focus:ring-0" placeholder="John Doe" type="text"/>
</div>
</div>
<div class="relative group">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1">Username</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl px-4 py-4 ring-1 ring-white/5 group-focus-within:ring-primary/40 transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="alternate_email">alternate_email</span>
<input class="bg-transparent border-none p-0 w-full text-on-surface placeholder:text-outline focus:ring-0" placeholder="velo_rider_99" type="text"/>
</div>
</div>
<div class="relative group">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1">Password</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl px-4 py-4 ring-1 ring-white/5 group-focus-within:ring-primary/40 transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="lock">lock</span>
<input class="bg-transparent border-none p-0 w-full text-on-surface placeholder:text-outline focus:ring-0" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:text-primary transition-colors" data-icon="visibility">visibility</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="relative group">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1">Vehicle No.</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl px-4 py-4 ring-1 ring-white/5 group-focus-within:ring-primary/40 transition-all duration-300">
<input class="bg-transparent border-none p-0 w-full text-on-surface placeholder:text-outline focus:ring-0" placeholder="BK-2024" type="text"/>
</div>
</div>
<div class="relative group">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1">Type</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl px-4 py-4 ring-1 ring-white/5 group-focus-within:ring-primary/40 transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant mr-2" data-icon="directions_bike">directions_bike</span>
<select class="bg-transparent border-none p-0 w-full text-on-surface focus:ring-0 appearance-none">
<option class="bg-surface-container text-on-surface">Bike</option>
<option class="bg-surface-container text-on-surface">Scooter</option>
</select>
</div>
</div>
</div>
</div>
<!-- Staff Fields (Hidden by default) -->
<div class="hidden space-y-5" id="staff-fields">
<div class="relative group">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1">Full Name</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl px-4 py-4 ring-1 ring-white/5 group-focus-within:ring-primary/40 transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="badge">badge</span>
<input class="bg-transparent border-none p-0 w-full text-on-surface placeholder:text-outline focus:ring-0" placeholder="Staff Name" type="text"/>
</div>
</div>
<div class="relative group">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1">Work Email</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl px-4 py-4 ring-1 ring-white/5 group-focus-within:ring-primary/40 transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="mail">mail</span>
<input class="bg-transparent border-none p-0 w-full text-on-surface placeholder:text-outline focus:ring-0" placeholder="staff@velokinetic.com" type="email"/>
</div>
</div>
<div class="relative group">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1">Password</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl px-4 py-4 ring-1 ring-white/5 group-focus-within:ring-primary/40 transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="lock">lock</span>
<input class="bg-transparent border-none p-0 w-full text-on-surface placeholder:text-outline focus:ring-0" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="relative group">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1">Role</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl px-4 py-4 ring-1 ring-white/5 group-focus-within:ring-primary/40 transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="admin_panel_settings">admin_panel_settings</span>
<select class="bg-transparent border-none p-0 w-full text-on-surface focus:ring-0 appearance-none">
<option class="bg-surface-container text-on-surface">Staff</option>
<option class="bg-surface-container text-on-surface">Admin</option>
</select>
</div>
</div>
</div>
<!-- CTA Section -->
<div class="pt-6 space-y-4">
<button class="w-full bg-primary hover:bg-primary-fixed text-on-primary-fixed font-headline font-extrabold py-5 rounded-full shadow-[0_10px_30px_rgba(162,255,191,0.2)] active:scale-[0.96] transition-all duration-200 text-lg">
                    Sign Up
                </button>
<p class="text-center font-body text-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-bold hover:underline underline-offset-4 ml-1" href="#">Login</a>
</p>
</div>
</div>
<!-- Decorative Kinetic Element -->
<div class="mt-12 flex justify-center opacity-10">
<span class="material-symbols-outlined text-6xl" data-icon="pedal_bike">pedal_bike</span>
</div>
</main>
<!-- Background Accents (Editorial Texture) -->
<div class="fixed top-[-10%] right-[-10%] w-96 h-96 bg-primary/5 blur-[120px] rounded-full pointer-events-none z-[-1]"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-96 h-96 bg-primary/5 blur-[120px] rounded-full pointer-events-none z-[-1]"></div>
<!-- UI Interaction Simulation Script -->
<script>
        const userTab = document.getElementById('tab-user');
        const staffTab = document.getElementById('tab-staff');
        const userFields = document.getElementById('user-fields');
        const staffFields = document.getElementById('staff-fields');

        userTab.addEventListener('click', () => {
            userTab.classList.add('tab-active');
            userTab.classList.remove('tab-inactive');
            staffTab.classList.add('tab-inactive');
            staffTab.classList.remove('tab-active');
            userFields.classList.remove('hidden');
            staffFields.classList.add('hidden');
        });

        staffTab.addEventListener('click', () => {
            staffTab.classList.add('tab-active');
            staffTab.classList.remove('tab-inactive');
            userTab.classList.add('tab-inactive');
            userTab.classList.remove('tab-active');
            staffFields.classList.remove('hidden');
            userFields.classList.add('hidden');
        });
    </script>
</body></html>
