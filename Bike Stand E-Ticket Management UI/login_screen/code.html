<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-gradient {
            background: linear-gradient(135deg, #a2ffbf 0%, #00fd93 100%);
        }
        .glass-panel {
            background: rgba(38, 38, 38, 0.6);
            backdrop-filter: blur(20px);
        }
        .text-glow {
            text-shadow: 0 0 20px rgba(162, 255, 191, 0.3);

    body {

<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary-fixed min-h-screen flex flex-col">
<main class="flex-grow flex flex-col items-center justify-center px-6 py-12 relative overflow-hidden">
<!-- Abstract Background Glow -->
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="w-full max-w-md z-10">
<!-- Brand Identity -->
<div class="mb-16 text-center">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-xl bg-surface-container-high mb-6 relative">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="directions_bike">directions_bike</span>
<div class="absolute inset-0 border border-primary/10 rounded-xl"></div>
</div>
<h1 class="font-headline text-4xl font-extrabold tracking-tighter text-glow uppercase text-primary mb-2">
                    KINETIC
                </h1>
<p class="font-body text-on-surface-variant tracking-wide">Secure Urban Bike Parking</p>
</div>
<!-- Login Form -->
<div class="space-y-8">
<div class="space-y-4">
<!-- Email Field -->
<div class="group">
<label class="block text-xs font-semibold uppercase tracking-widest text-on-surface-variant mb-2 ml-4">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-5 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="alternate_email">alternate_email</span>
<input class="w-full bg-surface-container-lowest border-none rounded-xl py-5 pl-14 pr-6 text-on-surface placeholder:text-on-secondary-fixed focus:ring-1 focus:ring-primary/30 transition-all outline-none" placeholder="rider@kinetic.io" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="group">
<label class="block text-xs font-semibold uppercase tracking-widest text-on-surface-variant mb-2 ml-4">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-5 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-lowest border-none rounded-xl py-5 pl-14 pr-14 text-on-surface placeholder:text-on-secondary-fixed focus:ring-1 focus:ring-primary/30 transition-all outline-none" placeholder="••••••••" type="password"/>
<button class="absolute right-5 text-on-surface-variant hover:text-on-surface">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<div class="flex justify-end">
<a class="text-sm font-medium text-primary hover:text-primary-dim transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Primary Action -->
<button class="kinetic-gradient w-full py-5 rounded-full text-on-primary-fixed font-headline font-bold text-lg tracking-tight active:scale-95 transition-all shadow-[0_10px_30px_rgba(162,255,191,0.15)]">
                    LOG IN
                </button>
<!-- Divider -->
<div class="relative py-4 flex items-center">
<div class="flex-grow border-t border-outline-variant/15"></div>
<span class="px-4 text-xs font-semibold uppercase tracking-widest text-on-secondary-fixed-variant">or continue with</span>
<div class="flex-grow border-t border-outline-variant/15"></div>
</div>
<!-- Social Login Bento-style -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container border border-outline-variant/10 py-4 rounded-xl hover:bg-surface-container-high transition-colors active:scale-[0.98]">
<img alt="Google" class="w-5 h-5 grayscale invert" data-alt="Google logo in white for dark mode" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB71fCs_qIfjjdC8YmeRnFfqQFLlIRzJu-e-QixJpN2Xtlpuzlz73BkWKVvcmoBkaaRTYVToTQ2oBeoUvwFf1I-pNSTov9WDQVt23sVORGbIPbZLlY9lUMFOdfg3VQmGiGd_xf1_xh48pEMVaGNR0KUyJpIseAuLr4e2N80Qf8C3sIe3vKiMg0xn3e16COducr7SYci2btaD6IA5crgYd0CVSexsvFUEHrO8kf0XWG8zBhf4ECQjCF3J7UYIIaevoxZIHm0pAP3B7Ji"/>
<span class="font-body text-sm font-semibold">Google</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-container border border-outline-variant/10 py-4 rounded-xl hover:bg-surface-container-high transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-on-surface" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="font-body text-sm font-semibold">Apple</span>
</button>
</div>
</div>
<!-- Footer Sign Up -->
<div class="mt-12 text-center">
<p class="text-on-surface-variant text-sm">
                    New to the circuit? 
                    <a class="text-primary font-bold ml-1 hover:underline" href="#">Create an Account</a>
</p>
</div>
</div>
</main>
<!-- Support Link Footer (Minimal) -->
<footer class="py-8 px-6 flex justify-center items-center space-x-8">
<a class="text-[10px] uppercase tracking-widest font-bold text-on-secondary-fixed hover:text-on-surface transition-colors" href="#">Terms of Service</a>
<div class="w-1 h-1 rounded-full bg-outline-variant/30"></div>
<a class="text-[10px] uppercase tracking-widest font-bold text-on-secondary-fixed hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
<div class="w-1 h-1 rounded-full bg-outline-variant/30"></div>
<a class="text-[10px] uppercase tracking-widest font-bold text-on-secondary-fixed hover:text-on-surface transition-colors" href="#">Support</a>
</footer>
