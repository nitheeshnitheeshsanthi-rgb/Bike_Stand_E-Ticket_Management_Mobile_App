<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vehicle Entry - KINETIC</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",

                extend: {
                    colors: {
                        "on-secondary": "#525151",
                        "primary-dim": "#00ed89",
                        "on-surface": "#ffffff",
                        "error-container": "#9f0519",
                        "surface-dim": "#0e0e0e",
                        "error": "#ff716c",
                        "on-tertiary": "#005160",
                        "on-surface-variant": "#adaaaa",
                        "surface-container-highest": "#262626",
                        "outline-variant": "#484847",
                        "secondary": "#e4e2e1",
                        "tertiary-container": "#11d8ff",
                        "primary-fixed-dim": "#00ed89",
                        "inverse-primary": "#006e3c",
                        "secondary-fixed": "#e4e2e1",
                        "surface-variant": "#262626",
                        "surface": "#0e0e0e",
                        "inverse-surface": "#fcf9f8",
                        "surface-tint": "#a2ffbf",
                        "on-primary-fixed": "#004624",
                        "on-tertiary-fixed": "#00313c",
                        "tertiary-fixed": "#11d8ff",
                        "surface-container-low": "#131313",
                        "on-secondary-fixed": "#3f3f3f",
                        "tertiary-dim": "#00caee",
                        "on-primary-container": "#005b31",
                        "tertiary-fixed-dim": "#00caee",
                        "on-tertiary-fixed-variant": "#005160",
                        "secondary-fixed-dim": "#d6d4d3",
                        "surface-container": "#1a1a1a",
                        "error-dim": "#d7383b",
                        "on-background": "#ffffff",
                        "secondary-dim": "#d6d4d3",
                        "surface-container-high": "#20201f",
                        "tertiary": "#7be2ff",
                        "outline": "#767575",
                        "on-secondary-fixed-variant": "#5c5b5b",
                        "on-tertiary-container": "#004755",
                        "secondary-container": "#474747",
                        "primary-fixed": "#00fd93",
                        "inverse-on-surface": "#565555",
                        "on-error-container": "#ffa8a3",
                        "on-primary-fixed-variant": "#006638",
                        "primary-container": "#00fd93",
                        "on-secondary-container": "#d2d0cf",
                        "surface-container-lowest": "#000000",
                        "on-error": "#490006",
                        "background": "#0e0e0e",
                        "on-primary": "#006437",
                        "primary": "#a2ffbf",
                        "surface-bright": "#2c2c2c"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0e0e0e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #a2ffbf 0%, #00fd93 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-[#0e0e0e] dark:bg-[#0e0e0e] flex justify-between items-center w-full px-6 py-4 fixed top-0 z-50">
<div class="flex items-center gap-4">
<button class="text-[#a2ffbf] hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-['Manrope'] tracking-tighter font-bold uppercase text-2xl font-black tracking-tighter text-[#a2ffbf]">KINETIC</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant/15">
<img class="w-full h-full object-cover" data-alt="User profile avatar smiling" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDa35uOuJnw5lb4elUV-wqXqlBykoBYWkyFeDREKEzG7N1-oR_7IAXkncjPDgsZAU-j_KwDKqCIBsh_3n1hFIVzkM7CEWnZhR7yS3JA9RkwHFjdeNgk-K_OUZD4aWsPEAUCV47z3z_tDgggWt9jxVqZz1oG9d522-iuYfsb0nQNOhE2Walz5LYZpJOS3CSIqpWoLRp_ffS2-zDz6AdXt3IRzvRQWCJtjJj-In_02HDoTuiuxh_3CQyJhrkv60mm9lvRPNd1WIexu72t"/>
</div>
</header>
<main class="mt-24 px-6 max-w-2xl mx-auto w-full flex-grow">
<!-- Header Section -->
<section class="mb-10">
<span class="font-headline text-primary text-sm font-bold tracking-[0.2em] uppercase mb-2 block">Registration</span>
<h2 class="font-headline text-on-surface text-4xl font-extrabold tracking-tighter leading-tight">
                Secure Your <br/>Space
            </h2>
</section>
<!-- Form Section -->
<form class="space-y-8">
<!-- Vehicle Info Card -->
<div class="bg-surface-container rounded-xl p-8 space-y-6">
<!-- Vehicle Type Toggle (Visual/Contextual) -->
<div class="flex gap-2 p-1 bg-surface-container-lowest rounded-full">
<button class="flex-1 py-3 px-4 rounded-full bg-surface-container-high text-primary font-bold text-sm flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-sm">pedal_bike</span>
                        Bicycle
                    </button>
<button class="flex-1 py-3 px-4 rounded-full text-on-surface-variant font-semibold text-sm flex items-center justify-center gap-2 hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-sm">electric_scooter</span>
                        E-Scooter
                    </button>
</div>
<!-- Brand/Model Input -->
<div class="space-y-2">
<label class="font-label text-sm text-on-surface-variant font-medium ml-1">Brand &amp; Model</label>
<div class="bg-surface-container-lowest rounded-lg group focus-within:ring-2 ring-primary/20 transition-all">
<input class="w-full bg-transparent border-none text-on-surface placeholder:text-outline py-4 px-5 focus:ring-0 font-body" placeholder="e.g. Specialized Sirrus X" type="text"/>
</div>
</div>
<!-- License Plate (Optional) -->
<div class="space-y-2">
<label class="font-label text-sm text-on-surface-variant font-medium ml-1">License Plate <span class="text-outline text-xs">(Optional)</span></label>
<div class="bg-surface-container-lowest rounded-lg group focus-within:ring-2 ring-primary/20 transition-all">
<input class="w-full bg-transparent border-none text-on-surface placeholder:text-outline py-4 px-5 focus:ring-0 font-body uppercase tracking-widest" placeholder="Not required for standard bikes" type="text"/>
</div>
</div>
</div>
<!-- Duration Selection Bento Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="col-span-2 space-y-2">
<label class="font-label text-sm text-on-surface-variant font-medium ml-1">Estimated Duration</label>
</div>
<button class="bg-surface-container-high p-6 rounded-xl flex flex-col items-start gap-4 hover:bg-surface-container-highest transition-all group" type="button">
<span class="material-symbols-outlined text-primary text-3xl">schedule</span>
<div class="text-left">
<p class="text-on-surface font-bold text-lg">Quick Stop</p>
<p class="text-on-surface-variant text-sm">Under 2 hours</p>
</div>
</button>
<button class="bg-primary/10 p-6 rounded-xl flex flex-col items-start gap-4 border border-primary/20 transition-all relative overflow-hidden" type="button">
<span class="material-symbols-outlined text-primary text-3xl">work</span>
<div class="text-left">
<p class="text-on-surface font-bold text-lg">Full Shift</p>
<p class="text-on-surface-variant text-sm">8-10 hours</p>
</div>
<div class="absolute top-2 right-2">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<div class="col-span-2 bg-surface-container-lowest p-6 rounded-xl flex items-center justify-between border border-outline-variant/10">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">calendar_today</span>
<span class="text-on-surface font-medium">Custom duration</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</div>
</div>
</form>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-24 left-0 w-full px-6 z-40">
<button class="hero-gradient w-full py-5 rounded-full text-on-primary-fixed font-headline font-extrabold text-lg tracking-tight shadow-[0_20px_40px_rgba(162,255,191,0.15)] active:scale-[0.96] transition-transform flex items-center justify-center gap-3">
<span>Generate Ticket</span>
<span class="material-symbols-outlined">confirmation_number</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-[#1a1a1a]/80 backdrop-blur-xl rounded-t-[3rem] px-4 pb-6 pt-2 shadow-[0_-20px_40px_rgba(162,255,191,0.05)]">
<a class="flex flex-col items-center justify-center text-[#adaaaa] py-2 px-4 hover:text-[#ffffff] transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">home_max</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-semibold mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-[#a2ffbf] bg-[#a2ffbf]/10 rounded-full py-2 px-4 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">confirmation_number</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-semibold mt-1">Ticket</span>
</a>
<a class="flex flex-col items-center justify-center text-[#adaaaa] py-2 px-4 hover:text-[#ffffff] transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-semibold mt-1">History</span>
</a>
<a class="flex flex-col items-center justify-center text-[#adaaaa] py-2 px-4 hover:text-[#ffffff] transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-semibold mt-1">Profile</span>
</a>
</nav>
</body></html>
