<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NeoCycle Staff Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#0e0e0e",
              "on-primary-fixed-variant": "#006638",
              "on-surface": "#ffffff",
              "error": "#ff716c",
              "on-secondary": "#525151",
              "on-error-container": "#ffa8a3",
              "surface-variant": "#262626",
              "surface-tint": "#a2ffbf",
              "secondary": "#e4e2e1",
              "tertiary-dim": "#00caee",
              "surface": "#0e0e0e",
              "inverse-surface": "#fcf9f8",
              "surface-bright": "#2c2c2c",
              "primary-container": "#00fd93",
              "background": "#0e0e0e",
              "error-dim": "#d7383b",
              "surface-container-low": "#131313",
              "primary-dim": "#00ed89",
              "tertiary-fixed": "#11d8ff",
              "secondary-container": "#474747",
              "on-surface-variant": "#adaaaa",
              "on-secondary-fixed": "#3f3f3f",
              "on-tertiary": "#005160",
              "primary-fixed-dim": "#00ed89",
              "surface-container-lowest": "#000000",
              "surface-container-high": "#20201f",
              "on-secondary-container": "#d2d0cf",
              "tertiary-container": "#11d8ff",
              "outline": "#767575",
              "on-primary-fixed": "#004624",
              "inverse-on-surface": "#565555",
              "secondary-dim": "#d6d4d3",
              "on-background": "#ffffff",
              "outline-variant": "#484847",
              "inverse-primary": "#006e3c",
              "surface-container-highest": "#262626",
              "error-container": "#9f0519",
              "on-primary": "#006437",
              "tertiary": "#7be2ff",
              "on-tertiary-fixed-variant": "#005160",
              "on-tertiary-fixed": "#00313c",
              "surface-container": "#1a1a1a",
              "tertiary-fixed-dim": "#00caee",
              "on-error": "#490006",
              "on-tertiary-container": "#004755",
              "primary": "#a2ffbf",
              "secondary-fixed": "#e4e2e1",
              "on-primary-container": "#005b31",
              "secondary-fixed-dim": "#d6d4d3",
              "primary-fixed": "#00fd93",
              "on-secondary-fixed-variant": "#5c5b5b"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0e0e0e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="docked full-width top-0 z-50 flex items-center justify-between px-6 py-4 w-full bg-[#0e0e0e]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#00FF94]" data-icon="shield_person">shield_person</span>
<span class="text-xl font-bold tracking-tighter text-[#00FF94] font-['Manrope']">NeoCycle Staff</span>
</div>
<div class="hidden md:flex gap-6 items-center">
<a class="text-[#adaaaa] font-['Manrope'] tracking-tight hover:opacity-80 transition-opacity" href="#">Support</a>
<a class="text-[#adaaaa] font-['Manrope'] tracking-tight hover:opacity-80 transition-opacity" href="#">Guidelines</a>
</div>
</header>
<main class="w-full max-w-[480px] px-6 pt-12 pb-32 flex-grow flex flex-col">
<!-- Headline Section -->
<section class="mb-10 pl-2">
<h1 class="font-headline text-[2rem] leading-tight font-extrabold tracking-tight mb-2 text-on-surface">
                Staff Registration
            </h1>
<p class="font-body text-on-surface-variant">
                Create your secure internal account to manage NeoCycle operations.
            </p>
</section>
<!-- Registration Form -->
<form class="space-y-6">
<!-- Full Name -->
<div class="space-y-2">
<label class="block text-sm font-medium font-label text-on-surface-variant ml-4">Full Name</label>
<div class="relative group">
<div class="absolute inset-y-0 left-5 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<input class="w-full bg-surface-container-lowest border-none ring-1 ring-outline-variant/15 focus:ring-2 focus:ring-primary text-on-surface py-4 pl-14 pr-6 rounded-xl transition-all font-body placeholder:text-outline-variant" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="block text-sm font-medium font-label text-on-surface-variant ml-4">Corporate Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-5 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary">
<span class="material-symbols-outlined" data-icon="email">email</span>
</div>
<input class="w-full bg-surface-container-lowest border-none ring-1 ring-outline-variant/15 focus:ring-2 focus:ring-primary text-on-surface py-4 pl-14 pr-6 rounded-xl transition-all font-body placeholder:text-outline-variant" placeholder="name@neocycle.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="block text-sm font-medium font-label text-on-surface-variant ml-4">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-5 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface-container-lowest border-none ring-1 ring-outline-variant/15 focus:ring-2 focus:ring-primary text-on-surface py-4 pl-14 pr-14 rounded-xl transition-all font-body placeholder:text-outline-variant" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-5 flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-2">
<label class="block text-sm font-medium font-label text-on-surface-variant ml-4">Confirm Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-5 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary">
<span class="material-symbols-outlined" data-icon="lock_check">lock</span>
</div>
<input class="w-full bg-surface-container-lowest border-none ring-1 ring-outline-variant/15 focus:ring-2 focus:ring-primary text-on-surface py-4 pl-14 pr-6 rounded-xl transition-all font-body placeholder:text-outline-variant" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Role Dropdown -->
<div class="space-y-2">
<label class="block text-sm font-medium font-label text-on-surface-variant ml-4">Assign Role</label>
<div class="relative group">
<div class="absolute inset-y-0 left-5 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary">
<span class="material-symbols-outlined" data-icon="badge">badge</span>
</div>
<select class="w-full bg-surface-container-lowest border-none ring-1 ring-outline-variant/15 focus:ring-2 focus:ring-primary text-on-surface py-4 pl-14 pr-10 rounded-xl transition-all font-body appearance-none">
<option selected="" value="staff">Staff (Operator)</option>
<option value="admin">Admin</option>
</select>
<div class="absolute inset-y-0 right-5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-6 space-y-4">
<button class="w-full py-5 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed font-headline font-bold text-lg active:scale-95 duration-200 transition-transform shadow-[0_20px_40px_rgba(162,255,191,0.15)]" type="submit">
                    Create Staff Account
                </button>
<div class="text-center pt-2">
<a class="text-on-surface-variant font-medium hover:text-on-surface transition-colors font-body flex items-center justify-center gap-2" href="#">
                        Already have an account? <span class="text-primary font-bold">Login</span>
</a>
</div>
</div>
</form>
<!-- Decorative Element -->
<div class="mt-12 opacity-30 select-none pointer-events-none">
<div class="h-px bg-gradient-to-r from-transparent via-outline-variant to-transparent w-full mb-8"></div>
<div class="flex justify-center gap-8">
<span class="material-symbols-outlined text-4xl" data-icon="qr_code_2">qr_code_2</span>
<span class="material-symbols-outlined text-4xl" data-icon="precision_manufacturing">precision_manufacturing</span>
<span class="material-symbols-outlined text-4xl" data-icon="directions_bike">directions_bike</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 pb-8 pt-4 bg-[#1a1a1a]/60 backdrop-blur-xl rounded-t-[3rem] shadow-[0_-20px_40px_rgba(162,255,191,0.08)]">
<a class="flex flex-col items-center justify-center text-[#adaaaa] p-3 hover:bg-[#262626] rounded-full transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="login">login</span>
<span class="font-['Manrope'] font-medium text-[12px] mt-1">Login</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#00FF94] text-[#004624] rounded-full p-3 transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person_add">person_add</span>
<span class="font-['Manrope'] font-medium text-[12px] mt-1">Register</span>
</a>
</nav>
</body></html>
